name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Verify and build release binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false

      - name: Validate release tag format and SDKVersion alignment
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer release tag: ${TAG_NAME}" >&2
            exit 1
          fi
          version="${TAG_NAME#v}"
          sdk_version=$(sed -n 's/.*SDKVersion = "\([^"]*\)".*/\1/p' constants.go)
          if [ "${version}" != "${sdk_version}" ]; then
            echo "Release tag ${TAG_NAME} does not match constants.SDKVersion (${sdk_version})" >&2
            exit 1
          fi

      - name: Verify the release passes race-enabled tests
        run: go test -race -shuffle=on ./...

      - name: Build binaries
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="typesafe_${version}_${os}_${arch}"
            if [ "$os" = "windows" ]; then
              name="${name}.exe"
            fi
            echo "building ${name}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" -o "dist/${name}" ./cmd/typesafe
          done
          cd dist
          sha256sum ./* > checksums.txt
          ls -l

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Attest and publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-dist
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" -- dist/*
          else
            gh release create "${TAG_NAME}" --title "${TAG_NAME}" --generate-notes -- dist/*
          fi
